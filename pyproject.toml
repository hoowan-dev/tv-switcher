[project]
name = "tv-switcher"
version = "0.1.0"
description = "TV input switcher"
readme = "README.md"
authors = [
    { name = "hoowan-dev", email = "becerrajuan007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
tv-switcher = "tv_switcher:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
